name: Sistema Lu — Bot Alertas

on:
  schedule:
    - cron: '00 13 * * 1-5'
    - cron: '45 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '15 15 * * 1-5'
    - cron: '00 16 * * 1-5'
    - cron: '45 16 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '15 18 * * 1-5'
    - cron: '00 19 * * 1-5'
    - cron: '45 19 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '00 21 * * 1-5'
  workflow_dispatch:

jobs:
  escanear:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests anthropic

      - name: Correr el bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CALLMEBOT_APIKEY:  ${{ secrets.CALLMEBOT_APIKEY }}
          WHATSAPP_NUMBER:   ${{ secrets.WHATSAPP_NUMBER }}
        run: python scanner_bot_v3.py
