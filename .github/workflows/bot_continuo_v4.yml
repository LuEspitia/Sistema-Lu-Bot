name: Solares — Sistema Sirio Bot

on:
  schedule:
    - cron: '00 13 * * 1-5'
    - cron: '45 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '15 15 * * 1-5'
    - cron: '00 16 * * 1-5'
    - cron: '45 16 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '15 18 * * 1-5'
    - cron: '00 19 * * 1-5'
    - cron: '45 19 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '00 21 * * 1-5'
  workflow_dispatch:

jobs:
  escanear:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # FIX 6: Guardar y restaurar el estado del dia entre corridas
      # La key incluye la fecha → se resetea automaticamente cada dia
      - name: Obtener fecha actual
        id: fecha
        run: echo "hoy=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restaurar estado del dia
        uses: actions/cache@v4
        with:
          path: /tmp/sirio_alertas_hoy.json
          key: sirio-estado-${{ steps.fecha.outputs.hoy }}-${{ github.run_number }}
          restore-keys: |
            sirio-estado-${{ steps.fecha.outputs.hoy }}-

      - name: Instalar librerias
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests anthropic

      - name: Correr el bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner_bot_v5.py
