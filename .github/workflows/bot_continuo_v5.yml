name: Solares — Sistema Sirio Bot

# ═══════════════════════════════════════════════════════════════
#  SCHEDULING — PROBLEMA CONOCIDO DE GITHUB ACTIONS
#  Los cron jobs internos de GitHub se retrasan o se omiten cuando
#  el repo tiene poca actividad. Solución: disparar via API externa.
#
#  TRIGGERS EXTERNOS (cron-job.org) — ver instrucciones en README:
#  Los crons de abajo son el RESPALDO. El disparador principal debe
#  ser una llamada HTTP desde cron-job.org al endpoint workflow_dispatch.
#  URL: https://api.github.com/repos/TU_USER/Sistema-Lu-Bot/actions/workflows/bot_continuo_v5.yml/dispatches
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    # ─── RESPALDO INTERNO (puede llegar tarde, es normal) ────────
    # ─── PRE-MARKET ──────────────────────────────────────────────
    - cron: '30 11 * * 1-5'   #  7:30am ET — 2h antes apertura (pre-market)
    # ─── MERCADO ABIERTO ─────────────────────────────────────────
    - cron: '30 13 * * 1-5'   #  9:30am ET — apertura
    - cron: '30 14 * * 1-5'   # 10:30am ET
    - cron: '30 15 * * 1-5'   # 11:30am ET
    - cron: '00 17 * * 1-5'   #  1:00pm ET — resumen 4H vela 1
    - cron: '30 17 * * 1-5'   #  1:30pm ET
    - cron: '30 18 * * 1-5'   #  2:30pm ET
    - cron: '30 19 * * 1-5'   #  3:30pm ET — último escaneo + resumen 4H cierre
    # NOTA: El código corta automáticamente si hora_et >= 16:00.

  # ─── TRIGGER EXTERNO (cron-job.org lo llama por HTTP) ────────
  workflow_dispatch:
    inputs:
      source:
        description: 'Origen del trigger (cron-job / manual / test)'
        required: false
        default: 'manual'

  # ─── KEEP-ALIVE: evita que GitHub desactive el workflow ──────
  # Un push al repo cada semana mantiene el scheduling activo.
  # Esto lo hace el job keep_alive de abajo automáticamente.
  push:
    branches: [ main ]
    paths-ignore: [ '.github/keep_alive' ]

# ── CONCURRENCY: evita runs paralelos ────────────────────────
# Si se disparan dos runs al mismo tiempo (schedule + dispatch manual,
# o dos dispatches), el segundo ESPERA en cola hasta que el primero
# termine y guarde su cache en /tmp/sirio_alertas_hoy.json.
# cancel-in-progress: false → NUNCA cancela el run activo (perdería el estado).
concurrency:
  group: sirio-diario
  cancel-in-progress: false

jobs:

  # ══════════════════════════════════════════════════════════════
  #  JOB PRINCIPAL — escaneo del sistema Sirio
  # ══════════════════════════════════════════════════════════════
  escanear:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Obtener fecha actual
        id: fecha
        run: echo "hoy=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restaurar estado del dia
        uses: actions/cache@v4
        with:
          path: /tmp/sirio_alertas_hoy.json
          key: sirio-v7-${{ steps.fecha.outputs.hoy }}-${{ github.run_number }}
          restore-keys: |
            sirio-v7-${{ steps.fecha.outputs.hoy }}-

      - name: Verificar estado restaurado
        run: |
          if [ -f /tmp/sirio_alertas_hoy.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/sirio_alertas_hoy.json')); print(d.get('count',0))" 2>/dev/null || echo "0")
            FECHA=$(python3 -c "import json; d=json.load(open('/tmp/sirio_alertas_hoy.json')); print(d.get('fecha',''))" 2>/dev/null || echo "")
            HOY=$(date +'%Y-%m-%d')
            echo "Estado: fecha=$FECHA count=$COUNT hoy=$HOY"
            if [ "$FECHA" != "$HOY" ]; then
              echo "Estado de otro dia — eliminando"
              rm /tmp/sirio_alertas_hoy.json
            else
              echo "Estado valido: $COUNT alertas enviadas hoy"
            fi
          else
            echo "Sin estado previo — dia limpio"
          fi

      - name: Instalar librerias
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests anthropic tradingview_ta pyswisseph

      - name: Correr el bot
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID:      ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET:  ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:       ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:       ${{ secrets.REDDIT_PASSWORD }}
          STOCKTWITS_TOKEN:      ${{ secrets.STOCKTWITS_TOKEN }}
        run: python scanner_bot_v8.py

      - name: Subir backtest y diario
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sirio-datos-${{ steps.fecha.outputs.hoy }}-run${{ github.run_number }}
          path: |
            /tmp/sirio_backtest.json
            /tmp/sirio_diario_sentiment.json
          if-no-files-found: ignore
          retention-days: 90

  # ══════════════════════════════════════════════════════════════
  #  JOB KEEP-ALIVE — evita que GitHub desactive el scheduling
  #  Se ejecuta todos los lunes a las 6am ET (10:00 UTC).
  #  Hace un commit mínimo al repo para mantenerlo "activo".
  # ══════════════════════════════════════════════════════════════
  keep_alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 10 * * 1'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep-alive commit
        run: |
          git config user.name  "Sirio Keep-Alive"
          git config user.email "sirio@solares.bot"
          mkdir -p .github
          echo "$(date -u +'%Y-%m-%d %H:%M UTC')" > .github/keep_alive
          git add .github/keep_alive
          git diff --staged --quiet || git commit -m "chore: keep-alive $(date -u +'%Y-%m-%d')"
          git push
