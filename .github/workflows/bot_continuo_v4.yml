name: Solares — Sistema Sirio Bot

on:
  schedule:
    # Escaneo de señales — cada 45 min en horario de mercado (ET)
    - cron: '00 13 * * 1-5'   #  9:00am ET
    - cron: '45 13 * * 1-5'   #  9:45am ET
    - cron: '30 14 * * 1-5'   # 10:30am ET
    - cron: '15 15 * * 1-5'   # 11:15am ET
    - cron: '00 16 * * 1-5'   # 12:00pm ET
    # Resumen 4H vela apertura — 30 min antes del cierre (1:00pm ET)
    - cron: '00 17 * * 1-5'   #  1:00pm ET ← RESUMEN VELA 4H #1
    - cron: '45 17 * * 1-5'   #  1:45pm ET
    - cron: '30 18 * * 1-5'   #  2:30pm ET
    # Resumen 4H vela cierre — 30 min antes del cierre de mercado (3:30pm ET)
    - cron: '30 19 * * 1-5'   #  3:30pm ET ← RESUMEN VELA 4H #2
    - cron: '15 20 * * 1-5'   #  4:15pm ET (post-market)
    - cron: '00 21 * * 1-5'   #  5:00pm ET (post-market)
  workflow_dispatch:

jobs:
  escanear:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Obtener fecha actual
        id: fecha
        run: echo "hoy=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restaurar estado del dia
        uses: actions/cache@v4
        with:
          path: /tmp/sirio_alertas_hoy.json
          key: sirio-v6-${{ steps.fecha.outputs.hoy }}-${{ github.run_number }}
          restore-keys: |
            sirio-v6-${{ steps.fecha.outputs.hoy }}-

      - name: Verificar estado restaurado
        run: |
          if [ -f /tmp/sirio_alertas_hoy.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/sirio_alertas_hoy.json')); print(d.get('count',0))" 2>/dev/null || echo "0")
            FECHA=$(python3 -c "import json; d=json.load(open('/tmp/sirio_alertas_hoy.json')); print(d.get('fecha',''))" 2>/dev/null || echo "")
            HOY=$(date +'%Y-%m-%d')
            echo "Estado: fecha=$FECHA count=$COUNT hoy=$HOY"
            if [ "$FECHA" != "$HOY" ]; then
              echo "Estado de otro dia — eliminando"
              rm /tmp/sirio_alertas_hoy.json
            else
              echo "Estado valido: $COUNT alertas enviadas hoy"
            fi
          else
            echo "Sin estado previo — dia limpio"
          fi

      - name: Instalar librerias
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests anthropic tradingview_ta

      - name: Correr el bot
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID:      ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET:  ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:       ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:       ${{ secrets.REDDIT_PASSWORD }}
          STOCKTWITS_TOKEN:      ${{ secrets.STOCKTWITS_TOKEN }}
        run: python scanner_bot_v6.py

      - name: Subir backtest y diario
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sirio-datos-${{ steps.fecha.outputs.hoy }}-run${{ github.run_number }}
          path: |
            /tmp/sirio_backtest.json
            /tmp/sirio_diario_sentiment.json
          if-no-files-found: ignore
          retention-days: 90
